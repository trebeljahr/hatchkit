- name: Install file and kernel audit tools
  ansible.builtin.apt:
    name: [aide, auditd, audispd-plugins]
    state: present

- name: Create private integrity directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - /etc/hatchkit-security
    - /var/lib/hatchkit-security/aide
    - /opt/hatchkit-backups

- name: Install reviewed baseline policy
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../cli/src/templates/file-integrity/aide.conf"
    dest: /etc/hatchkit-security/aide.conf
    owner: root
    group: root
    mode: '0600'

- name: Create private generated-bytecode cache
  ansible.builtin.file:
    path: /var/cache/hatchkit-security/python
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Create shared service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/hatchkit-.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Relocate generated bytecode for maintenance services
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../cli/src/templates/backups/hatchkit-python-cache.conf"
    dest: /etc/systemd/system/hatchkit-.service.d/python-cache.conf
    owner: root
    group: root
    mode: '0644'

- name: Install integrity runner and units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../cli/src/templates/file-integrity/{{ item.name }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {name: file-integrity.py, dest: /opt/hatchkit-backups/file-integrity.py, mode: '0700'}
    - {name: hatchkit-file-integrity.service, dest: /etc/systemd/system/hatchkit-file-integrity.service, mode: '0644'}
    - {name: hatchkit-file-integrity.timer, dest: /etc/systemd/system/hatchkit-file-integrity.timer, mode: '0644'}

- name: Stop duplicate distribution timer
  ansible.builtin.systemd:
    name: dailyaidecheck.timer
    enabled: false
    state: stopped
  failed_when: false

- name: Enable baseline checks (missing baseline fails visibly)
  ansible.builtin.systemd:
    name: hatchkit-file-integrity.timer
    daemon_reload: true
    enabled: true
    state: started

- name: Enable kernel auditing
  ansible.builtin.service:
    name: auditd
    enabled: true
    state: started

- name: Bound audit history and low-disk behavior
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^\s*{{ item.key }}\s*='
    line: '{{ item.key }} = {{ item.value }}'
    backup: true
  loop:
    - {key: max_log_file, value: '32'}
    - {key: num_logs, value: '14'}
    - {key: max_log_file_action, value: ROTATE}
    - {key: space_left, value: '512'}
    - {key: space_left_action, value: SYSLOG}
    - {key: admin_space_left, value: '256'}
    - {key: admin_space_left_action, value: SUSPEND}
    - {key: disk_full_action, value: SUSPEND}
    - {key: disk_error_action, value: SYSLOG}
  register: audit_logging

- name: Reload audit logging configuration
  ansible.builtin.command: auditctl --signal reload
  when: audit_logging.changed

- name: Install scoped audit policy
  ansible.builtin.copy:
    src: hatchkit-audit.rules
    dest: /etc/audit/rules.d/70-hatchkit.rules
    owner: root
    group: root
    mode: '0600'
    backup: true

- name: Persist immutable audit policy after the rules
  ansible.builtin.copy:
    content: "-e 2\n"
    dest: /etc/audit/rules.d/99-hatchkit-finalize.rules
    owner: root
    group: root
    mode: '0600'

- name: Read current audit enforcement state
  ansible.builtin.command: auditctl -s
  register: audit_state
  changed_when: false

- name: Load policy when kernel audit rules are mutable
  ansible.builtin.command: augenrules --load
  when: "'enabled 2' not in audit_state.stdout"

- name: Explain immutable-host policy updates
  ansible.builtin.debug:
    msg: Existing immutable audit rules remain active. Review any policy diff before a scheduled reboot loads it.
  when: "'enabled 2' in audit_state.stdout"
