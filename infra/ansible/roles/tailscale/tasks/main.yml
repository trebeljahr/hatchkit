- name: Install Tailscale via official install script
  ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
  args:
    creates: /usr/bin/tailscale

- name: Check Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Enable and start tailscaled
  ansible.builtin.service:
    name: tailscaled
    enabled: true
    state: started

- name: Bring up Tailscale
  block:
    - name: Create temporary auth key file
      ansible.builtin.tempfile:
        state: file
        prefix: tailscale-auth-
      register: tailscale_auth_file

    - name: Write temporary auth key
      ansible.builtin.copy:
        content: "{{ tailscale_auth_key }}"
        dest: "{{ tailscale_auth_file.path }}"
        mode: "0600"

    - name: Authenticate Tailscale
      ansible.builtin.command:
        argv:
          - tailscale
          - up
          - "--authkey=file:{{ tailscale_auth_file.path }}"
          - "--hostname={{ tailscale_hostname }}"
          - --ssh
          - --accept-routes=false
          - --accept-dns=false
  always:
    - name: Remove temporary auth key file
      ansible.builtin.file:
        path: "{{ tailscale_auth_file.path }}"
        state: absent
      when: tailscale_auth_file.path is defined
  no_log: true
  when:
    - tailscale_auth_key | length > 0
    - tailscale_status.rc != 0 or '"BackendState":"Running"' not in tailscale_status.stdout

- name: Persist IP forwarding for the exit node
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/99-tailscale.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding
  when: tailscale_advertise_exit_node | bool

- name: Read Tailscale preferences
  ansible.builtin.command: tailscale debug prefs
  register: tailscale_prefs
  changed_when: false
  check_mode: false

- name: Set the exit node offer
  ansible.builtin.command:
    argv:
      - tailscale
      - set
      - "--advertise-exit-node={{ tailscale_advertise_exit_node | bool | lower }}"
  # The offer shows up in prefs as advertised default routes.
  when: >-
    (tailscale_advertise_exit_node | bool) !=
    ('0.0.0.0/0' in (tailscale_prefs.stdout | from_json).AdvertiseRoutes | default([], true))

- name: Verify Tailscale is running
  ansible.builtin.command: tailscale status
  register: tailscale_verify
  changed_when: false
  failed_when: tailscale_verify.rc != 0
  when: tailscale_restrict_ssh

# Restrict SSH to Tailscale network after verifying connectivity
- name: Restrict SSH to Tailscale CGNAT range
  community.general.ufw:
    rule: allow
    from_ip: 100.64.0.0/10
    port: "22"
    proto: tcp
    comment: SSH via Tailscale only
  when: tailscale_restrict_ssh

- name: Remove public SSH access
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    delete: true
  when: tailscale_restrict_ssh
  failed_when: false

- name: Print Tailscale access info
  ansible.builtin.debug:
    msg: >
      Tailscale is running. SSH via tailnet: ssh {{ ssh_allowed_users | default(['root']) | first }}@{{ tailscale_hostname }}.
      Emergency access: Hetzner web console (VNC) → ufw allow 22/tcp.
  when: tailscale_restrict_ssh
