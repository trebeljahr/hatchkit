services:
  uptime-kuma:
    # Official rootless variant: runs as node (uid 1000) with no added
    # capabilities, so patch releases need no derived image.
    image: louislam/uptime-kuma:2-rootless
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - uptime-kuma:/app/data
    healthcheck:
      test: ["CMD-SHELL", "extra/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
volumes:
  uptime-kuma: {}
