# Reviewed Next standalone variant; qualify each app before applying.
# Keep persistent assets/uploads on their existing explicit writable mounts.
# Confirm UID 1000 and test any ISR/image/cache paths for this exact image.
services:
  app:
    mem_limit: 1g
    memswap_limit: 2g
    cpus: 1
    pids_limit: 512
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /app/.next/cache:rw,nosuid,nodev,noexec,size=128m,uid=1000,gid=1000,mode=755
