worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 10m;
  server {
    listen 8080;
    location = /bridge/prepare { proxy_pass http://relay:8787/prepare; }
    location = /bridge/confirm { proxy_pass http://relay:8787/confirm; }
    location = /webhooks/service/ses { proxy_pass http://relay:8787/feedback; }
    location /webhooks/ { return 404; }
    location / {
      proxy_pass http://listmonk:9000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Connection "";
    }
  }
}
