# npm dependency updates. Minor and patch updates arrive as one grouped PR a
# week; .github/workflows/dependency-updates.yml tests it, squash-merges it and
# deploys. Security fixes arrive as one grouped PR too, as soon as GitHub knows
# about them. Major updates are left out on purpose: they need a person.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    # A new release waits a week before it is proposed, so a hijacked or broken
    # version has time to be pulled first. Security updates skip the wait.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Add a semver-minor ignore for each 0.x dependency the app's behaviour
      # rests on (a 0.x minor is a breaking release), and for tooling whose
      # minors change its config (Biome needs `biome migrate`):
      # - dependency-name: "@biomejs/biome"
      #   update-types: ["version-update:semver-minor"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
