database_in=file:/var/lib/hatchkit-security/aide/aide.db
database_out=file:/var/lib/hatchkit-security/aide/aide.db.new
gzip_dbout=no
report_url=stdout
report_level=changed_attributes
HARDENED = p+i+n+u+g+s+m+c+sha256+sha512+acl+xattrs+caps
/etc HARDENED
/boot HARDENED
# EFI FAT inode numbers are allocated in memory; retain hashes and other metadata.
/boot/efi HARDENED-i
/usr/bin HARDENED
/usr/sbin HARDENED
/usr/lib/systemd HARDENED
/usr/local/bin HARDENED
/opt/hatchkit-backups HARDENED
/var/spool/cron HARDENED
!/etc/mtab$
!/etc/ld\.so\.cache$
!/etc/\.pwd\.lock$

# Protect the native control-plane resource override; no automatic learning.
/data/coolify/source/docker-compose\.custom\.yml$ HARDENED
