# Electron Windows build (NSIS installer), signed with Azure Trusted Signing.
#
# App identity: __HATCHKIT_BUNDLE_ID__ / "__HATCHKIT_APP_NAME__".
# electron-builder reads that identity from the root package.json `build`
# block (`appId`, `productName`) — `hatchkit signing apply` keeps it in
# step with the manifest, so do not set it here as well.
#
# Required repo secrets:
#   AZURE_TENANT_ID          — Azure AD tenant containing the Trusted Signing account
#   AZURE_CLIENT_ID          — service principal app ID (or federated identity client ID)
#   AZURE_CLIENT_SECRET      — service principal secret (omit if using OIDC; see below)
#   AZURE_TS_ACCOUNT         — Trusted Signing account name
#   AZURE_TS_PROFILE         — certificate profile name (Public Trust if eligible, else Private Trust)
#   AZURE_TS_ENDPOINT        — e.g. https://wus2.codesigning.azure.net
#   AZURE_TS_PUBLISHER_NAME  — the subject name on the certificate profile; it must
#                              match exactly or signing fails at the last step
#   NEXT_PUBLIC_API_URL      — baked into the client export at build time. A static
#                              export has no runtime env, so an installer built
#                              without it ships and then fails on its first request.
#
# OIDC upgrade (recommended once secret-auth works): drop AZURE_CLIENT_SECRET,
# add `permissions: id-token: write` to the job, and configure a federated
# identity credential on the Azure AD app registration pointing at this repo.

name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: __HATCHKIT_PNPM_VERSION__

      - uses: actions/setup-node@v4
        with:
          node-version: __HATCHKIT_NODE_VERSION__
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build client static export
        run: pnpm build:client
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Compile Electron main + preload
        run: pnpm electron:compile

      # Trusted Signing credentials are passed as config overrides rather
      # than committed to package.json: they name an Azure account, which
      # does not belong in the repo, and they differ per environment.
      - name: Package + sign (electron-builder)
        run: >
          pnpm exec electron-builder --win --publish never
          -c.win.azureSignOptions.publisherName="${{ secrets.AZURE_TS_PUBLISHER_NAME }}"
          -c.win.azureSignOptions.endpoint="${{ secrets.AZURE_TS_ENDPOINT }}"
          -c.win.azureSignOptions.codeSigningAccountName="${{ secrets.AZURE_TS_ACCOUNT }}"
          -c.win.azureSignOptions.certificateProfileName="${{ secrets.AZURE_TS_PROFILE }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # electron-builder reports a signing failure as a warning in some
      # configurations and still produces an installer, so the signature is
      # verified independently. An unsigned installer shipped to users
      # triggers SmartScreen and cannot be fixed after the fact.
      - name: Verify signatures
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe `
            | Where-Object { $_.FullName -match "x64\\signtool.exe$" } | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          $artifacts = Get-ChildItem -Recurse -Include *.exe,*.msi -Path release
          if (-not $artifacts) { throw "no installers found under release/" }
          $artifacts | ForEach-Object {
            Write-Host "Verifying $_"
            & $signtool verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "verify failed for $_" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: error
