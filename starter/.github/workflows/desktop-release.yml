name: Desktop Release

# Triggered by pushing a tag like v0.1.0 or manual dispatch.
# Each platform job builds an Electron app and uploads the installer as
# a workflow artifact. Attach those artifacts to a GitHub release, or add
# a distribution step of your own here.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            artifact-glob: "release/*.zip"
          - os: windows-latest
            target: win
            artifact-glob: "release/*.exe"
          - os: ubuntu-latest
            target: linux
            artifact-glob: "release/*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build client static export
        run: pnpm build:client
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Compile Electron
        run: pnpm electron:compile

      - name: Package (electron-builder)
        run: pnpm exec electron-builder --${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: ${{ matrix.artifact-glob }}
