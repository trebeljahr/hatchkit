name: build-and-deploy

on:
  push:
    branches: [main]

concurrency:
  group: main-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test:unit
      - run: pnpm run test:client

  e2e:
    runs-on: ubuntu-latest
    needs: [verify]
    services:
      mongo-e2e:
        image: mongo:7
        ports:
          - 27018:27017
      redis-e2e:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Local S3 for the server's storage service. Same image and tag as
      # e2e/start-server.sh; `S3_BUCKET` creates the bucket on startup, and
      # with no credentials configured SeaweedFS accepts any signature.
      # Endpoint, bucket and credentials come from playwright.config.ts.
      - name: Start SeaweedFS
        run: |
          docker run -d --name e2e-seaweedfs -p 9002:8333 \
            -e S3_BUCKET=starter-e2e \
            --tmpfs /data chrislusf/seaweedfs:4.47
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9002/starter-e2e && exit 0
            sleep 1
          done
          echo "SeaweedFS did not serve bucket starter-e2e within 60s" >&2
          docker logs e2e-seaweedfs >&2
          exit 1

      - run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          CI: "true"
          MONGODB_URI: mongodb://127.0.0.1:27018/starter-e2e
          REDIS_URL: redis://127.0.0.1:6380
          BETTER_AUTH_SECRET: e2e-test-secret
          BETTER_AUTH_URL: http://127.0.0.1:5006
          FRONTEND_URL: http://127.0.0.1:3001

  build-server:
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          # Bakes the commit into the image so /api/health can report it.
          # The deploy job polls that field until it matches this sha —
          # an HTTP 200 from the deploy POST only proves Coolify accepted
          # the request, not that the new image is what ends up running.
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}-server:main
            ghcr.io/${{ github.repository }}-server:${{ github.sha }}

  build-client:
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/client/Dockerfile
          push: true
          # NEXT_PUBLIC_* are inlined into the browser bundle at image
          # BUILD time — setting them as runtime env on the deployed
          # container does nothing. The URL values below are written by
          # hatchkit at scaffold time (and kept in sync by
          # `hatchkit regen-infra` / `hatchkit rename-domain`). The
          # analytics values are optional GitHub Actions repo VARIABLES
          # (not secrets): gh variable set NEXT_PUBLIC_PLAUSIBLE_DOMAIN ...
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
            NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL=${{ vars.NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}-client:main
            ghcr.io/${{ github.repository }}-client:${{ github.sha }}

  # Deploy job. It holds no Coolify API token: the promote step moves
  # the `:live` tag in GHCR with this job's GITHUB_TOKEN, and the deploy
  # step signs a webhook with each app's own deploy secret, which can
  # deploy that one app and nothing else. hatchkit mints those secrets
  # (`hatchkit sync`, `hatchkit secrets isolate`).
  #
  # Which apps get deployed depends on the project's topology
  # (`topology` in .hatchkit.json). The two secret sets are mutually
  # exclusive — hatchkit sets one and clears the other:
  #
  #   single-origin  ONE Coolify app pulling both the -server and -client
  #                  images. COOLIFY_RESOURCE_UUID + COOLIFY_DEPLOY_*.
  #   split          TWO Coolify apps. COOLIFY_SERVER_* and COOLIFY_CLIENT_*
  #                  are set and the unprefixed ones are cleared.
  #
  # Why split does NOT also set the unprefixed set: it would point at the
  # bare-domain app (the client), which the CLIENT_ set already covers, so
  # every push would deploy the client twice.
  deploy:
    runs-on: ubuntu-latest
    needs: [build-server, build-client]
    steps:
      # Point `:live` at the images this run built. Every Coolify app
      # pulls `:live` (hatchkit sets that when it wires the app), so
      # this is what decides which build the deploy below starts — the
      # immutable `:<sha>` tag, re-published under the name the apps
      # read. It uses this job's own GITHUB_TOKEN (`packages: write`),
      # which can write this repository's packages and nothing else; no
      # Coolify credential is involved.
      #
      # A rollback is the same step with an older sha.
      - name: Promote this commit's images to :live
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: env.COOLIFY_BASE_URL != ''
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for half in server client; do
            image="ghcr.io/${{ github.repository }}-$half"
            if ! docker buildx imagetools inspect "$image:${{ github.sha }}" >/dev/null 2>&1; then
              echo "no $image:${{ github.sha }} — this project has no $half image"
              continue
            fi
            docker buildx imagetools create --tag "$image:live" "$image:${{ github.sha }}"
            echo "promoted $image:${{ github.sha }} to :live"
          done

      # Tell Coolify to deploy. There is no Coolify API token here: each
      # app has its own webhook secret (hatchkit mints it), and a `push`
      # payload signed with it queues a deploy of that one app — it can
      # read nothing and touch no other app. The payload names
      # `.hatchkit/deploy-webhook`, the app's only watch path, so an ordinary
      # push that reaches Coolify through its GitHub App never deploys a
      # build that does not exist yet; only this step does.
      #
      # Which apps: COOLIFY_RESOURCE_UUID for a single-app project, or
      # COOLIFY_SERVER_/COOLIFY_CLIENT_RESOURCE_UUID for a split one.
      # hatchkit sets one set and clears the other.
      - name: Deploy via signed Coolify webhook
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
          COOLIFY_DEPLOY_SECRET: ${{ secrets.COOLIFY_DEPLOY_SECRET }}
          COOLIFY_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_DEPLOY_REPOSITORY }}
          COOLIFY_DEPLOY_BRANCH: ${{ secrets.COOLIFY_DEPLOY_BRANCH }}
          COOLIFY_SERVER_RESOURCE_UUID: ${{ secrets.COOLIFY_SERVER_RESOURCE_UUID }}
          COOLIFY_SERVER_DEPLOY_SECRET: ${{ secrets.COOLIFY_SERVER_DEPLOY_SECRET }}
          COOLIFY_SERVER_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_SERVER_DEPLOY_REPOSITORY }}
          COOLIFY_SERVER_DEPLOY_BRANCH: ${{ secrets.COOLIFY_SERVER_DEPLOY_BRANCH }}
          COOLIFY_CLIENT_RESOURCE_UUID: ${{ secrets.COOLIFY_CLIENT_RESOURCE_UUID }}
          COOLIFY_CLIENT_DEPLOY_SECRET: ${{ secrets.COOLIFY_CLIENT_DEPLOY_SECRET }}
          COOLIFY_CLIENT_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_CLIENT_DEPLOY_REPOSITORY }}
          COOLIFY_CLIENT_DEPLOY_BRANCH: ${{ secrets.COOLIFY_CLIENT_DEPLOY_BRANCH }}
        if: env.COOLIFY_BASE_URL != ''
        run: |
          set -euo pipefail
          deployed=0
          deploy() { # label, secret-name prefix
            local uuid_var="${2}RESOURCE_UUID" secret_var="${2}DEPLOY_SECRET"
            local repo_var="${2}DEPLOY_REPOSITORY" branch_var="${2}DEPLOY_BRANCH"
            local uuid="${!uuid_var:-}" secret="${!secret_var:-}"
            local repo="${!repo_var:-}" branch="${!branch_var:-}"
            [ -n "$uuid" ] || return 0
            if [ -z "$secret" ] || [ -z "$repo" ] || [ -z "$branch" ]; then
              echo "::error::${2}DEPLOY_SECRET/_REPOSITORY/_BRANCH are not set — run \`hatchkit sync\` or \`hatchkit secrets isolate\`."
              exit 1
            fi
            local body sig answer
            body=$(jq -cn --arg ref "refs/heads/$branch" --arg sha "$GITHUB_SHA" --arg repo "$repo" \
              '{ref: $ref, after: $sha, repository: {full_name: $repo}, commits: [{id: $sha, added: [], removed: [], modified: [".hatchkit/deploy-webhook"]}]}')
            sig=$(printf '%s' "$body" | HOOK_SECRET="$secret" node -e \
              'process.stdout.write(require("node:crypto").createHmac("sha256", process.env.HOOK_SECRET).update(require("node:fs").readFileSync(0)).digest("hex"))')
            answer=$(curl -fsS -X POST "$COOLIFY_BASE_URL/webhooks/source/github/events/manual" \
              -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' \
              -H "X-Hub-Signature-256: sha256=$sig" --data-binary "$body")
            if printf '%s' "$answer" | jq -e --arg uuid "$uuid" \
              'type == "array" and any(.[]; .application_uuid == $uuid and .status == "success")' \
              >/dev/null 2>&1; then
              echo "deploy queued for the $1 app ($uuid)"
              deployed=$((deployed + 1))
            else
              # Other apps on the same repo answer "Invalid signature.";
              # they are left out so a public log names only this one.
              detail=$(printf '%s' "$answer" | jq -c '[.[]? | select(.message != "Invalid signature.") | {status, message}]' 2>/dev/null || printf '%s' "$answer" | head -c 200)
              echo "::error::Coolify did not queue a deploy of the $1 app: $detail"
              exit 1
            fi
          }
          deploy app COOLIFY_
          deploy server COOLIFY_SERVER_
          deploy client COOLIFY_CLIENT_
          if [ "$deployed" -eq 0 ]; then
            echo "::error::COOLIFY_BASE_URL is set but no COOLIFY_*RESOURCE_UUID is — nothing was deployed."
            exit 1
          fi

      # Everything above only proves Coolify ACCEPTED a request. This
      # proves the deployed artefacts are the ones this run built.
      #
      # Until this existed, the pipeline's final assertion was an HTTP 200
      # from a POST. A deploy that kept the old container, an image built
      # with an empty API URL, a container crash-looping behind a proxy
      # that answers 503 — all three shipped green, and none of them was
      # visible from CI, from ghcr, or from the Coolify dashboard.
      #
      # Deliberately polls: a Coolify deploy is asynchronous, the POST
      # returns as soon as the deployment is QUEUED.
      #
      # Guarded on a deploy having been TRIGGERED, not on the URLs being
      # set. A per-URL `if:` would let this step skip while the deploy
      # steps above ran — a job that reports green having verified
      # nothing, which is the exact failure mode this step exists to
      # remove. When a deploy fired and there is no URL to check, the
      # script fails and says so.
      #
      # HATCHKIT_WEB_URL / HATCHKIT_API_URL are written here as literals
      # by hatchkit from the manifest's domain + topology (and kept
      # current by `hatchkit rename-domain` / `hatchkit regen-infra`).
      # The `vars.` reference is the fallback for a hand-managed repo.
      # Leave one empty to skip that half: a backend-only project has no
      # web URL, a static one has no API. When the two are equal the
      # project is single-origin and the CORS check is skipped, because
      # there is no cross-origin request to make.
      - name: Verify the deployment is actually live
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          HATCHKIT_WEB_URL: ${{ vars.HATCHKIT_WEB_URL }}
          HATCHKIT_API_URL: ${{ vars.HATCHKIT_API_URL }}
        if: env.COOLIFY_BASE_URL != ''
        run: |
          set -uo pipefail
          SHA='${{ github.sha }}'
          # `:-` so a workflow whose env block was edited fails with the
          # gate's own message rather than a bare "unbound variable".
          WEB="${HATCHKIT_WEB_URL:-}"
          API="${HATCHKIT_API_URL:-}"
          WEB="${WEB%/}"
          API="${API%/}"
          checked=0

          # `?hatchkit_cb=` on every request: the point is what the ORIGIN
          # now serves, and a CDN hit would answer with exactly the stale
          # copy being tested for.
          poll() { # label url jq-expression
            got=""
            for i in $(seq 1 40); do
              got=$(curl -fsSL --max-time 10 "$2?hatchkit_cb=$i$RANDOM" 2>/dev/null \
                      | jq -r "$3" 2>/dev/null || true)
              if [ "$got" = "$SHA" ]; then echo "✓ $1 reports $SHA"; return 0; fi
              echo "  $1: ${got:-<no response>} — waiting ($i/40)"
              sleep 15
            done
            echo "::error::$1 never reported $SHA — the deploy did not land."
            echo "::error::last seen: ${got:-<no response>}"
            echo "::error::an empty/null reading on the first run after upgrading means the"
            echo "::error::artefact does not report a version yet: the server needs"
            echo "::error::\`version: env.COMMIT_SHA\` on /api/health, the client needs"
            echo "::error::version.json written by its Dockerfile. Both come from COMMIT_SHA."
            return 1
          }

          if [ -n "$API" ]; then
            poll "api $API/api/health" "$API/api/health" '.version' || exit 1
            checked=$((checked + 1))
          fi

          if [ -n "$WEB" ]; then
            poll "web $WEB/version.json" "$WEB/version.json" '.commit' || exit 1
            checked=$((checked + 1))

            # The client bakes its API origin in at build time, so a
            # correct commit can still carry the wrong URL. Assert the
            # pairing — this is the check that catches an image built
            # against an unset repo variable.
            if [ -n "$API" ]; then
              baked=$(curl -fsSL --max-time 10 "$WEB/version.json?hatchkit_cb=$RANDOM" | jq -r '.apiUrl')
              if [ "$baked" != "$API" ]; then
                echo "::error::client was built against '${baked:-<empty>}', expected '$API'"
                exit 1
              fi
              echo "✓ client is built against $baked"
            fi
          fi

          # Cross-origin only. Under single-origin the API is same-origin
          # with the web app, so CORS never enters the picture; under
          # split it is load-bearing and nothing else exercises it — the
          # e2e suite runs both halves on localhost.
          if [ -n "$WEB" ] && [ -n "$API" ] && [ "$WEB" != "$API" ]; then
            allow=$(curl -fsS --max-time 10 -o /dev/null -D - -X OPTIONS \
                      -H "Origin: $WEB" \
                      -H 'Access-Control-Request-Method: POST' \
                      -H 'Access-Control-Request-Headers: content-type' \
                      "$API/api/health" \
                    | tr -d '\r' | awk -F': ' 'tolower($1)=="access-control-allow-origin"{print $2}')
            if [ "$allow" != "$WEB" ]; then
              echo "::error::CORS preflight returned '${allow:-<none>}', expected '$WEB'"
              echo "::error::the server's FRONTEND_URL / TRUSTED_ORIGINS do not cover the web origin"
              exit 1
            fi
            echo "✓ CORS allows $WEB"
            checked=$((checked + 1))
          fi

          if [ "$checked" -eq 0 ]; then
            echo "::error::a deploy was triggered and nothing was verified."
            echo "::error::set HATCHKIT_WEB_URL / HATCHKIT_API_URL in this workflow"
            echo "::error::(or as repo variables), or run \`hatchkit regen-infra\`."
            exit 1
          fi

      # Native shells (Capacitor, Electron) load the client from their
      # own document origin, and better-auth rejects an origin missing from
      # TRUSTED_ORIGINS with 403 INVALID_ORIGIN before it checks the
      # password. The web-origin CORS check above cannot see that.
      #
      # Two details decide whether this probe can fail at all:
      #   · `Sec-Fetch-Mode: cors`. better-auth only force-validates Origin
      #     on a cookieless sign-in when Sec-Fetch-* headers are present,
      #     which every browser and WebView sends and curl does not.
      #   · A body that PASSES schema validation. better-call validates the
      #     body before the sign-in route's origin check runs, so `{}`
      #     answers 400 for a trusted and an untrusted origin alike.
      # With both, an untrusted origin gets 403 INVALID_ORIGIN and a trusted
      # one reaches the credential check and gets 401 for an address that
      # cannot exist (`.invalid` is reserved). Nothing ever signs in.
      #
      # Sign-in is rate-limited (3 per 10s per IP in production), hence the
      # spacing and the retry on 429.
      #
      # HATCHKIT_NATIVE_ORIGINS is written here as a literal by hatchkit from
      # the manifest's features (mobile / desktop) and kept
      # current by `hatchkit update` / `hatchkit regen-infra`. Empty means
      # the project ships no native client and there is nothing to check.
      - name: Verify native clients can sign in
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          HATCHKIT_API_URL: ${{ vars.HATCHKIT_API_URL }}
          HATCHKIT_NATIVE_ORIGINS: ${{ vars.HATCHKIT_NATIVE_ORIGINS }}
        if: env.COOLIFY_BASE_URL != ''
        run: |
          set -uo pipefail
          API="${HATCHKIT_API_URL:-}"
          API="${API%/}"
          NATIVE="${HATCHKIT_NATIVE_ORIGINS:-}"
          if [ -z "$NATIVE" ]; then
            echo "· no native clients in this project — nothing to check"
            exit 0
          fi
          if [ -z "$API" ]; then
            echo "::error::HATCHKIT_NATIVE_ORIGINS is set but HATCHKIT_API_URL is empty — nothing to probe."
            exit 1
          fi
          out=$(mktemp)
          failed=0
          for origin in $(printf '%s' "$NATIVE" | tr ',' ' '); do
            for attempt in 1 2 3; do
              status=$(curl -sS --max-time 10 -o "$out" -w '%{http_code}' \
                         -X POST "$API/api/auth/sign-in/email" \
                         -H "Origin: $origin" \
                         -H 'Sec-Fetch-Mode: cors' \
                         -H 'content-type: application/json' \
                         --data '{"email":"hatchkit-origin-probe@example.invalid","password":"hatchkit-origin-probe"}')
              [ "$status" = "429" ] || break
              echo "  $origin: rate-limited, retrying ($attempt/3)"
              sleep 11
            done
            body=$(head -c 300 "$out" 2>/dev/null || true)
            if [ "$status" = "403" ] || printf '%s' "$body" | grep -q INVALID_ORIGIN; then
              echo "::error::$origin is NOT trusted: sign-in answered $status $body"
              echo "::error::add it to TRUSTED_ORIGINS on the server app (\`hatchkit sync --deploy\`)"
              failed=1
            elif [ "$status" = "401" ]; then
              echo "✓ $origin is trusted (sign-in reached the credential check: 401)"
            else
              echo "::error::$origin: expected 401 from the credential check, got ${status:-<none>} $body"
              failed=1
            fi
            sleep 4
          done
          exit "$failed"
