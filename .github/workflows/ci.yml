name: CLI CI

# Two independent jobs:
#
#   check        — fast static gates: JSON smoke tests, typecheck, lint, and
#                  the scaffold matrix (file-presence assertions).
#   stamp-build  — slow end-to-end gate: stamp a project out of `starter/`,
#                  then `pnpm install && pnpm run build && pnpm run test:unit`
#                  inside it. Kept separate from `check` on purpose — it takes
#                  minutes and should fail on its own, without masking or
#                  being masked by the static gates.
#
# `starter/` is a plain directory tracked in this repo (there is no
# .gitmodules), so a bare `actions/checkout` is enough to stamp a project.
# It used to be a private submodule, which is why the scaffold matrix still
# carries a graceful skip path — that skip no longer fires in CI.
#
# The paths filters cover `starter/**` as well as `cli/**`: the generator is
# the template plus the codegen, and template-only regressions used to slip
# through unbuilt because CI never ran on a starter-only change.

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "starter/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "cli/**"
      - "starter/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # libsecret alone is not enough: the test suite really stores and
      # deletes keychain entries (under a throwaway service name), so keytar
      # needs a secret service to talk to. gnome-keyring + dbus-x11 provide
      # one inside the test step, the same way stamp-build does.
      - name: Install libsecret + an ephemeral keyring (keytar runtime deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev gnome-keyring dbus-x11

      - uses: pnpm/action-setup@v4

      # Deliberately left on 22 while stamp-build runs 24: this job exercises
      # the *published CLI*, which declares no `engines` floor, so keeping it a
      # major behind is a cheap check that hatchkit still runs for users on the
      # previous LTS. Bump it only together with an explicit engines field.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: JSON smoke tests
        shell: bash
        run: |
          set -euo pipefail

          export HATCHKIT_CONF_DIR
          HATCHKIT_CONF_DIR="$(mktemp -d)"
          trap 'rm -rf "$HATCHKIT_CONF_DIR"' EXIT

          pnpm --filter @hatchkit/dev-shared run build

          # --dir, not --filter: a --filter exec is recursive, and when the
          # command exits non-zero pnpm appends its own failure report to
          # STDOUT, after the JSON under test.
          hatchkit() {
            pnpm --dir cli exec tsx src/index.ts "$@"
          }

          parse_json() {
            node -e 'JSON.parse(require("fs").readFileSync(0, "utf8"))'
          }

          hatchkit status --json | parse_json

          # doctor exits 1 whenever a check fails, by design. On a runner gh
          # is installed but not signed in, so the GitHub check always fails
          # here. Accept that exit; anything else, or JSON that does not
          # parse, still fails the step.
          doctor_json="$RUNNER_TEMP/doctor.json"
          doctor_rc=0
          hatchkit doctor --json > "$doctor_json" || doctor_rc=$?
          [ "$doctor_rc" -le 1 ] || exit "$doctor_rc"
          parse_json < "$doctor_json"

          hatchkit explain --json | parse_json

      - name: Typecheck
        run: pnpm --filter hatchkit run typecheck

      - name: Lint
        run: pnpm --filter hatchkit run lint

      - name: Test (scaffold matrix)
        shell: bash
        run: |
          set -euo pipefail
          # Single quotes on purpose: the inner bash expands the variables.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -c '
            set -euo pipefail
            # Same throwaway keyring as stamp-build: the passphrase is
            # generated per run, never printed, and dies with the session.
            keyring_pass="$(openssl rand -hex 16)"
            gnome-keyring-daemon --components=secrets --daemonize --unlock <<< "$keyring_pass" > /dev/null
            unset keyring_pass
            pnpm --filter hatchkit run test
          '

  scaffold-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libsecret (keytar runtime dep)
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dev-shared
        run: pnpm --filter @hatchkit/dev-shared run build

      - name: Scaffold a static project
        env:
          HATCHKIT_CONF_DIR: ${{ runner.temp }}/hatchkit-conf
          HATCHKIT_DEV_CONFIG_DIR: ${{ runner.temp }}/hatchkit-dev
        run: pnpm --filter hatchkit exec tsx scaffold-fixture.ts "${{ runner.temp }}/fixture" static

      # The scaffold has no lockfile of its own — resolve fresh.
      - name: Install the scaffolded project
        working-directory: ${{ runner.temp }}/fixture
        run: pnpm install --no-frozen-lockfile

      - name: Build the scaffolded project
        working-directory: ${{ runner.temp }}/fixture
        run: pnpm run build

      # Mirrors the Coolify client image build, which sets this flag and
      # supplies NEXT_PUBLIC_* as build args. A static surface has no
      # API, so the guard must be gone rather than satisfied.
      - name: Build as the Coolify client image would
        working-directory: ${{ runner.temp }}/fixture
        env:
          HATCHKIT_IMAGE_BUILD: "1"
        run: pnpm --filter @starter/client run build

  stamp-build:
    name: stamp-build (${{ matrix.preset }})
    runs-on: ubuntu-latest
    # A hung `next build` should cost minutes, not hours.
    timeout-minutes: 30
    strategy:
      # Every preset is informative on its own; don't cancel one because
      # another broke.
      fail-fast: false
      matrix:
        # Six combinations, and no more — every entry costs a full
        # install plus a Next build. The presets are defined in
        # cli/scripts/ci-stamp.ts; these names must match its PRESETS keys.
        #
        # This matrix BUILDS a few representative combinations. The cheap
        # structural sweep over all of them — bare, each feature alone,
        # the full set and the interacting pairs — is
        # cli/test-feature-matrix.ts, which runs in `pnpm test` without
        # installing anything.
        #
        # The axis that matters is whether a native shell was selected. With
        # desktop/mobile, scaffoldApp calls flipNextConfigToStaticExport()
        # and the client is rebuilt as `output: "export"`; without one, the
        # starter's own next.config.ts survives and the client builds
        # `output: "standalone"`. Both modes have to compile.
        #
        #   reported — static export. The feature set from the "fresh scaffold
        #              won't build" report: websocket, s3, analytics, desktop,
        #              mobile.
        #   commerce — static export. stripe + listmonk-ses, the opposite
        #              branch of the conditional codegen (Stripe service files
        #              kept, newsletter pages kept inside a static-export
        #              client — that combination is what surfaced the
        #              useSearchParams/prerender breakage).
        #   web      — standalone. No native shell, so the base next.config.ts
        #              is left in place and the plain web deploy — the most
        #              common configuration, and previously never built by CI
        #              at all — gets compiled.
        #   bare     — standalone, nothing selected. Every feature
        #              conditional takes its "remove" arm, which is where
        #              a missed strip shows up as a build error.
        #   full     — static export, every feature at once: the
        #              opposite end of the same axis.
        #   client-core
        #            — standalone. The one preset whose reason to exist is the
        #              LAST step rather than the build: client-core is the only
        #              feature that makes the generated server import a
        #              workspace package by name at runtime, under `tsx`, and a
        #              named import that cannot link is invisible to `tsc` and
        #              to `next build` (both read `@starter/shared` through its
        #              `.d.ts`). v0.2.18 shipped exactly that — see
        #              cli/test-client-core-shared-exports.ts, which covers the
        #              resolution without an install; this preset is what runs
        #              the generated suite itself.
        preset: [reported, commerce, web, bare, full, client-core]
    env:
      # Every client next.config.ts throws by design when a production build
      # whose output ships to users has no NEXT_PUBLIC_API_URL — Next inlines
      # NEXT_PUBLIC_* at build time, so a missing value cannot be repaired at
      # runtime. That guard lives both in the starter's next.config.ts (gated
      # on NEXT_FILE_EXPORT / HATCHKIT_IMAGE_BUILD) and in the static-export
      # config that flipNextConfigToStaticExport() writes, so it applies to the
      # export presets here and is harmless for the standalone one. Any
      # absolute URL satisfies it; nothing is ever fetched from this host.
      NEXT_PUBLIC_API_URL: https://example.test
      # NEXT_FILE_EXPORT is deliberately NOT set. The export presets don't read
      # it — flipNextConfigToStaticExport() hardcodes `output: "export"`, so the
      # env var was dead weight there — and setting it would flip the `web`
      # preset out of the standalone path this matrix exists to cover.
      #
      # STAMP_DIR is not set here: `runner` is not an allowed context in a
      # job-level env, and GitHub rejects the whole workflow file (zero jobs,
      # no logs) when it is. The steps below spell out ${{ runner.temp }}/stamp.
      STAMP_PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@v4

      # libsecret is keytar's runtime dep; gnome-keyring + dbus-x11 give it a
      # secret service to talk to. Scaffolding mints a dotenvx private key and
      # stores it via keytar, which cannot work on a headless runner without
      # one. The keyring below is created inside a throwaway D-Bus session and
      # dies with the step — no persistent credential store is touched.
      - name: Install libsecret + an ephemeral keyring (keytar runtime deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev gnome-keyring dbus-x11

      - uses: pnpm/action-setup@v4

      # 24, not 22: the stamped project's root package.json declares
      # `engines: { node: ">=24" }`, so the build gate has to run on the version
      # the starter actually asks for. (The stamped project also pins
      # packageManager pnpm@11.x while this monorepo pins 10.x — pnpm
      # self-switches when it enters the stamp dir, which is expected.)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The scaffolder's local-dev codegen imports @hatchkit/dev-shared from
      # its build output, so the workspace package has to be compiled before
      # scaffoldApp is loaded.
      - name: Build dev-shared
        run: pnpm --filter @hatchkit/dev-shared run build

      - name: Stamp a project
        shell: bash
        env:
          STAMP_DIR: ${{ runner.temp }}/stamp
        run: |
          set -euo pipefail
          # Single quotes on purpose: the inner bash expands the variables.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -c '
            set -euo pipefail
            # The unlock passphrase is generated per run rather than written
            # literally here: the keyring is ephemeral and dies with the D-Bus
            # session, so the value is meaningless, but a plaintext password in
            # a tracked file is a bad pattern to copy. It is never printed.
            keyring_pass="$(openssl rand -hex 16)"
            gnome-keyring-daemon --components=secrets --daemonize --unlock <<< "$keyring_pass" > /dev/null
            unset keyring_pass
            pnpm --filter hatchkit exec tsx scripts/ci-stamp.ts \
              --preset "$STAMP_PRESET" --out "$STAMP_DIR"
          '

      # NOT --frozen-lockfile: scaffolding prunes dependencies the chosen
      # feature set doesn't need (electron/electron-builder/icon-gen/wait-on,
      # the @capacitor/* set, client-side deps in
      # scaffold/surfaces.ts) and can add others, so the lockfile copied out of
      # starter/ no longer matches the stamped package.json manifests. The
      # @starter/* workspace package names are NOT rewritten — rename-project.ts
      # leaves them alone on purpose, and the generated root scripts still say
      # `pnpm --filter @starter/shared run build` — so the drift is dependency
      # pruning, not renaming. pnpm defaults to frozen when CI=true, hence the
      # explicit opt-out.
      - name: Install stamped project
        working-directory: ${{ runner.temp }}/stamp
        run: pnpm install --no-frozen-lockfile

      - name: Build stamped project
        working-directory: ${{ runner.temp }}/stamp
        run: pnpm run build

      # client-core's contract test reads a committed snapshot of the tRPC
      # router that the starter deliberately does NOT ship: the test fails with
      # instructions rather than skipping, and the feature's own post-scaffold
      # note tells the user to run this once and commit the result. Do the same
      # here, so the step after it is testing the router and not the absence of
      # a file. No other preset has the script.
      - name: Emit the tRPC contract snapshot
        if: matrix.preset == 'client-core'
        working-directory: ${{ runner.temp }}/stamp
        run: pnpm run contract:emit

      - name: Unit tests in stamped project
        working-directory: ${{ runner.temp }}/stamp
        run: pnpm run test:unit
