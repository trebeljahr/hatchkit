# hatchkit.trebeljahr.com: the docs export on Cloudflare Workers static assets.
#
# build   Export docs/, carry the hashed files of the two releases before it
#         (scripts/carry-static.mjs, from the live /release-assets.json),
#         write _headers/_redirects/releases.json and check the Workers Free
#         limits (scripts/docs-worker-files.mjs), then `wrangler versions
#         upload`. Nothing is live yet.
# deploy  `wrangler versions deploy <version>@100%`, then wait until the
#         homepage and /version.json name this commit (scripts/verify-release.mjs).
#
# Upload and activation are separate steps on purpose: one-step `wrangler
# deploy` left a few seconds where new HTML was live and its chunks 404'd
# (hatchkit-test canary, 2026-10-12).
#
# Set up once by hand, never by this workflow (wrangler.jsonc has no
# `routes`, so deploys leave them alone):
#   zone trebeljahr.com  hatchkit.trebeljahr.com/.well-known/acme-challenge/*  → no Worker
#                        hatchkit.trebeljahr.com/*                             → hatchkit-docs
#   secrets              CLOUDFLARE_API_TOKEN (Individual Workers Editor on hatchkit-docs only)
#                        CLOUDFLARE_ACCOUNT_ID
#
# Rollback: dispatch `deploy` with an earlier version_id and its target_sha
# (`wrangler versions list` in docs/ shows each version's commit as its tag).
# To hand the hostname back to the Coolify nginx app, delete the
# hatchkit.trebeljahr.com/* route; Traefik answers again within seconds.
name: Build & Release

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/write-version.mjs"
      - "scripts/carry-static.mjs"
      - "scripts/docs-worker-files.mjs"
      - "scripts/verify-release.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: Build a new version, deploy an uploaded one, or verify the live site
        type: choice
        options: [build, deploy, verify]
        default: build
      version_id:
        description: Worker version ID to activate (deploy only)
        type: string
        required: false
      target_sha:
        description: Full commit SHA that version serves (deploy and verify)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: docs-release-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  WRANGLER: wrangler@4.145.0
  SITE: https://hatchkit.trebeljahr.com

jobs:
  build:
    if: github.repository == 'trebeljahr/hatchkit' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.operation == 'build')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test scripts/docs-worker-files.test.mjs
      - name: Export the docs
        working-directory: docs
        env:
          NEXT_PUBLIC_BUILD_COMMIT: ${{ github.sha }}
        # --ignore-workspace: docs/ is its own project (docs/.npmrc), but pnpm
        # finds the root pnpm-workspace.yaml first and installs cli/ + mcp/
        # instead. The Docker build never saw this: it copied docs/ alone.
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm build
      - name: Prepare the upload
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          node scripts/write-version.mjs docs/out "$RELEASE_SHA"
          node scripts/carry-static.mjs --site "$SITE" --out docs/out --release "$RELEASE_SHA" --keep 2
          node scripts/docs-worker-files.mjs docs/out "$RELEASE_SHA"
      - id: upload
        name: Upload a version without activating it
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ github.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          WRANGLER_SEND_METRICS: "false"
        run: |
          npx --yes "$WRANGLER" versions upload --tag "$RELEASE_SHA" --message "docs $RELEASE_SHA"
          version_id=$(node -e '
            const rows = require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n").map((line) => JSON.parse(line));
            const id = rows.find((row) => row.type === "version-upload")?.version_id ?? "";
            if (!/^[0-9a-f-]{36}$/.test(id)) throw new Error("wrangler reported no version id");
            console.log(id);
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "Uploaded version $version_id for $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: >-
      always() && !cancelled() &&
      github.repository == 'trebeljahr/hatchkit' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.build.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Activate the version
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ github.event_name == 'push' && needs.build.outputs.version_id || inputs.version_id }}
          TARGET_SHA: ${{ github.event_name == 'push' && github.sha || inputs.target_sha }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          [[ "$VERSION_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::version_id is required"; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target_sha must be a full commit SHA"; exit 1; }
          npx --yes "$WRANGLER" versions deploy "$VERSION_ID@100%" --yes --message "docs $TARGET_SHA"
      - name: Wait until the site serves this commit
        env:
          TARGET_SHA: ${{ github.event_name == 'push' && github.sha || inputs.target_sha }}
        run: node scripts/verify-release.mjs "$TARGET_SHA"

  verify:
    if: github.repository == 'trebeljahr/hatchkit' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.operation == 'verify'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify the serving commit without deploying
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: node scripts/verify-release.mjs "$TARGET_SHA"
