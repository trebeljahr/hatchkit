# nginx config for the static docs image (see the root Dockerfile).
#
# `next build` with `output: "export"` writes each page as `<route>.html`
# NEXT TO a `<route>/` directory that holds the route's RSC segment files
# (`__next.*.txt`). The stock nginx:alpine config has no try_files, so a
# request for `/docs/commands` found the directory, answered with a 301
# to `/docs/commands/`, and that answered 403 because the directory has
# no index.html. Every docs page failed that way on the 2026-09-28
# rollout while `/` kept working.
# The drain marker each health probe answers to. Docker's probe comes over
# loopback and fails as soon as the drain starts. Traefik's own check comes
# straight from Traefik with an X-Hatchkit-Drain header and no
# X-Forwarded-For (Traefik adds that to every request it forwards, so a
# visitor can't pose as it), and fails from the later -proxy marker on.
map "$remote_addr|$http_x_hatchkit_drain|$http_x_forwarded_for" $hatchkit_drain_marker {
    "~^(127\.0\.0\.1|::1)\|" /tmp/hatchkit-site-draining;
    "~^[^|]*\|[^|]+\|$"       /tmp/hatchkit-site-draining-proxy;
    default "";
}
map $hatchkit_drain_marker $hatchkit_proxy_probe {
    /tmp/hatchkit-site-draining-proxy 1;
    default 0;
}

# Next's exported RSC requests identify their build. Only a full SHA may select
# a retained directory; unknown/expired IDs get a real 404 and client navigation
# reloads the same URL. Never fall through to current RSC with old client code.
map $http_x_deployment_id $docs_release_root {
    default /usr/share/nginx/html;
    "~^[a-f0-9]{40}$" /var/lib/hatchkit-docs-releases/releases/$http_x_deployment_id;
}
map $http_x_deployment_id $docs_response_deployment {
    default "";
    "~^[a-f0-9]{40}$" $http_x_deployment_id;
}
map $http_x_deployment_id $docs_invalid_release {
    default 1;
    "" 0;
    "~^[a-f0-9]{40}$" 0;
}

server {
    listen       80;
    server_name  localhost;
    root         $docs_release_root;
    if ($docs_invalid_release) { return 400; }
    add_header Cache-Control "no-store" always;
    add_header Vary "x-deployment-id" always;
    # Exported Flight data contains a build ID; Next navigation uses the
    # deployment ID instead when configured. Echo only the validated tree ID.
    add_header x-nextjs-deployment-id $docs_response_deployment always;

    location ^~ /__releases/ { return 404; }
    location ^~ /__legacy-assets/ { return 404; }

    location ^~ /_next/static/ {
        root /var/lib/hatchkit-docs-releases;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /releases.json {
        root /var/lib/hatchkit-docs-releases;
        add_header Cache-Control "no-store" always;
        try_files /releases.json =404;
    }

    location = /version.json {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        try_files /version.json =404;
    }

    # Relative Location headers. Behind Traefik and Cloudflare nginx only
    # sees plain http, so an absolute redirect would send visitors to
    # http:// and cost them an extra hop back to https.
    absolute_redirect off;

    # Coolify probes the process over loopback, Traefik with its own check.
    # Public requests keep serving while the failing checks remove this
    # backend from Traefik. Outside a drain Traefik's check needs no page.
    location = / {
        if (-f $hatchkit_drain_marker) { return 503; }
        if ($hatchkit_proxy_probe) { return 200 "serving\n"; }
        try_files /index.html =404;
    }

    # `/docs/commands/` → `/docs/commands`. The export has no
    # `<route>/index.html`, so the slash form can only ever 403. Old
    # links and the redirects the previous config handed out still land.
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    location / {
        index     index.html;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Missing JS/RSC must stay a 404, never a successful HTML fallback.
}
