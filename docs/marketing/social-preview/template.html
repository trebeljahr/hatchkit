<!doctype html>
<!--
  GitHub social preview card, 1280x640. Three variants, picked with ?v=a|b|c:
    a  screenshot-led: headline beside the real `hatchkit create --dry-run` screenshot
    b  typographic: logo, headline and the command, in the docs site's brand
    c  light: the four commands of a project's life, from setup to restore
  Rendered by scripts/marketing/render-social-preview.mjs. Key content stays
  inside the 64 px safe margin.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>hatchkit social preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=block">
<style>
  :root {
    --bg: #0b0d12; --hatch: #161a26; --fg: #ffffff; --muted: #9aa3b2;
    --accent: #818cf8; --accent-soft: #a5b4fc; --ok: #34d399;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; font-family: Inter, sans-serif; color: var(--fg); background: var(--bg); }
  .card { position: relative; width: 1280px; height: 640px; overflow: hidden; background: var(--bg); }
  .hatch { position: absolute; inset: 0;
    background-image: repeating-linear-gradient(45deg, var(--hatch) 0 1px, transparent 1px 34px); }
  .glow { position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 60% at 30% 0%, rgba(99,102,241,.38), rgba(99,102,241,.04) 60%, transparent 100%); }
  .topline { position: absolute; left: 0; top: 0; right: 0; height: 4px; background: var(--accent); }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 64px; height: 64px; flex: none; }
  .brand span { font-size: 40px; font-weight: 700; letter-spacing: -1px; }
  code, .mono { font-family: "JetBrains Mono", monospace; font-variant-ligatures: none; }
  .url { display: flex; align-items: center; gap: 12px; font: 500 22px "JetBrains Mono", monospace; color: var(--muted); }
  .url i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); display: block; }

  /* A: screenshot-led */
  .a .text { position: absolute; left: 64px; top: 64px; width: 520px; bottom: 64px; display: flex; flex-direction: column; }
  .a h1 { margin: 52px 0 0; font-size: 60px; line-height: 1.04; letter-spacing: -2px; font-weight: 800; }
  .a p { margin: 26px 0 0; font-size: 25px; line-height: 1.38; color: #c3c9d4; }
  .a p code { color: var(--accent-soft); font-size: 23px; }
  .a .url { margin-top: auto; }
  .a .shot { position: absolute; left: 640px; top: 72px; width: 760px; height: 640px; overflow: hidden;
    border-radius: 16px 0 0 0; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px #2a3044; }
  .a .shot img { display: block; width: 1100px; margin: 0; }

  /* B: typographic */
  .b .wrap { position: absolute; inset: 64px; display: flex; flex-direction: column; }
  .b h1 { margin: 56px 0 0; font-size: 74px; line-height: 1.06; letter-spacing: -2.6px; font-weight: 800;
    background: linear-gradient(#ffffff, #c7d2fe); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .b h1 code { font-size: 64px; letter-spacing: -1px; color: var(--accent-soft); -webkit-text-fill-color: var(--accent-soft); }
  .b p { margin: 28px 0 0; max-width: 1040px; font-size: 27px; line-height: 1.4; color: var(--muted); }
  .b .url { margin-top: auto; }

  /* C: light, command lifecycle */
  .c { --bg: #f5f6fb; --hatch: #e7e9f3; --fg: #10131b; --muted: #535b6d; background: var(--bg); color: var(--fg); }
  .c .glow { background: radial-gradient(ellipse 60% 60% at 85% 0%, rgba(129,140,248,.30), transparent 70%); }
  .c .wrap { position: absolute; inset: 64px; display: flex; flex-direction: column; }
  .c h1 { margin: 40px 0 0; font-size: 56px; line-height: 1.08; letter-spacing: -1.8px; font-weight: 800; max-width: 1060px; }
  .c .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; margin-top: 52px; }
  .c .step { position: relative; background: #ffffff; border: 1px solid #dcdfeb; border-radius: 14px; padding: 18px 20px 20px;
    box-shadow: 0 6px 20px rgba(16,19,27,.06); }
  .c .step + .step::before { content: ""; position: absolute; left: -23px; top: 50%; width: 22px; height: 2px; background: var(--accent); }
  .c .step code { display: block; font-size: 21px; font-weight: 700; color: #4f46e5; }
  .c .step span { display: block; margin-top: 10px; font-size: 19px; line-height: 1.35; color: var(--muted); }
  .c .url { margin-top: auto; color: var(--muted); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="hatch"></div>
  <div class="glow"></div>
  <div class="topline"></div>
  <div id="content"></div>
</div>

<template id="logo">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <rect width="120" height="120" rx="28" fill="#818cf8"/>
    <path d="M34 18 L102 86" stroke="#0b0d12" stroke-width="9" stroke-linecap="round"/>
    <path d="M18 34 L86 102" stroke="#0b0d12" stroke-width="9" stroke-linecap="round"/>
    <path d="M50 18 L102 70" stroke="#0b0d12" stroke-width="9" stroke-linecap="round" stroke-opacity="0.55"/>
    <path d="M18 50 L70 102" stroke="#0b0d12" stroke-width="9" stroke-linecap="round" stroke-opacity="0.55"/>
  </svg>
</template>

<script>
  const v = new URLSearchParams(location.search).get("v") || "a";
  const logo = document.getElementById("logo").innerHTML;
  const brand = `<div class="brand">${logo}<span>hatchkit</span></div>`;
  const url = `<div class="url"><i></i>hatchkit.trebeljahr.com</div>`;
  const variants = {
    a: `<div class="text">${brand}
          <h1>Start a TypeScript app on a server you own.</h1>
          <p><code>hatchkit create</code> sets up the GitHub repo, DNS, a Hetzner server and the Coolify deploy in one run.</p>
          ${url}</div>
        <div class="shot"><img src="../screenshots/create-dry-run.png" alt=""></div>`,
    b: `<div class="wrap">${brand}
          <h1>From <code>hatchkit create</code><br>to a running app on your own server.</h1>
          <p>Repo, DNS, server, deploy, error tracking and analytics, set up by one open&#8209;source CLI.</p>
          ${url}</div>`,
    c: `<div class="wrap">${brand}
          <h1>Set up once. Then create, deploy and maintain apps on servers you own.</h1>
          <div class="steps">
            <div class="step"><code>hatchkit setup</code><span>Provider tokens go to the OS keychain</span></div>
            <div class="step"><code>hatchkit create</code><span>Repo, DNS, server and first deploy</span></div>
            <div class="step"><code>hatchkit sync</code><span>Domains, env and deploy secrets kept in step</span></div>
            <div class="step"><code>hatchkit backup</code><span>Snapshots and isolated restore tests</span></div>
          </div>
          ${url}</div>`,
  };
  document.getElementById("card").classList.add(v);
  document.getElementById("content").innerHTML = variants[v];
</script>
</body>
</html>
